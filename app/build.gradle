plugins { id 'com.android.application' }
android {
    namespace 'com.bougepense.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.bougepense.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }
    // Clé de signature fixe : les prochaines mises à jour s'installent sans désinstaller
    signingConfigs {
        fixe {
            storeFile file('bougepense.keystore')
            storePassword 'bougepense'
            keyAlias 'bougepense'
            keyPassword 'bougepense'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixe }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
